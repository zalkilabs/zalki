name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
            echo 'Expected vMAJOR.MINOR.PATCH or a prerelease such as v0.1.0-rc.1' >&2
            exit 1
          fi
          printf 'version=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  checks:
    name: Release checks
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release
    needs: [version, checks]
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a commit from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: make completions release-check
      - name: Build, sign, and notarize release
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          for release_secret in MACOS_SIGN_P12 MACOS_SIGN_PASSWORD MACOS_NOTARY_KEY MACOS_NOTARY_KEY_ID MACOS_NOTARY_ISSUER_ID; do
            if [ -z "${!release_secret}" ]; then
              echo "::error::Missing release signing secret: $release_secret"
              exit 1
            fi
          done
          goreleaser release --clean --skip=publish --timeout=30m
      - name: Verify packages and generate cask
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          ZALKI_REQUIRE_SIGNED: "1"
        run: sh scripts/check-release.sh dist "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zalki-${{ needs.version.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/zalki.rb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  draft:
    name: Create draft
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: zalki-${{ needs.version.outputs.version }}
          path: release
      - name: Create draft with release notes
        working-directory: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          shasum -a 256 --check checksums.txt
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to overwrite it.' >&2
            exit 1
          fi
          set -- --draft --verify-tag --generate-notes
          case "$RELEASE_TAG" in *-*) set -- "$@" --prerelease ;; esac
          gh release create "$RELEASE_TAG" "$@" ./*.tar.gz checksums.txt zalki.rb
