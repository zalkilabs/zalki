name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    # Keep existing required check names authoritative for the new coverage.
    needs: [test-alias, windows-vet, unraced-linux, unraced-darwin, fault-controls-linux, fault-controls-darwin]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require completed aliases, reporter, both owning tests and both focused controls
        env:
          ALIAS_RESULT: ${{ needs['test-alias'].result }}
          WINDOWS_RESULT: ${{ needs['windows-vet'].result }}
          LINUX_OWNING_RESULT: ${{ needs['unraced-linux'].result }}
          DARWIN_OWNING_RESULT: ${{ needs['unraced-darwin'].result }}
          LINUX_FAULTS_RESULT: ${{ needs['fault-controls-linux'].result }}
          DARWIN_FAULTS_RESULT: ${{ needs['fault-controls-darwin'].result }}
        run: |
          if [[ "$ALIAS_RESULT" != success || "$WINDOWS_RESULT" != success || "$LINUX_OWNING_RESULT" != success || "$DARWIN_OWNING_RESULT" != success || "$LINUX_FAULTS_RESULT" != success || "$DARWIN_FAULTS_RESULT" != success ]]; then
            echo "Required coverage incomplete: alias=$ALIAS_RESULT, windows=$WINDOWS_RESULT, linux_owning=$LINUX_OWNING_RESULT, darwin_owning=$DARWIN_OWNING_RESULT, linux_controls=$LINUX_FAULTS_RESULT, darwin_controls=$DARWIN_FAULTS_RESULT" >&2
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: make fmt-check test-required vet
      - name: Check Homebrew cask syntax
        if: runner.os == 'macOS'
        run: |
          ruby -c packaging/homebrew/zalki.rb.tmpl
          sh -n scripts/*.sh

  test-alias:
    name: Alias tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      # The runner disables module/toolchain network access in the test child.
      - run: go mod download
      - name: Run the required suite with a proven temporary-path alias
        env:
          ZALKI_TEST_ALIAS_REPORT: ${{ runner.temp }}/alias-test.json
        run: make test-alias
      - name: Retain the full alias test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: alias-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/alias-test.json
          if-no-files-found: error

  lint:
    name: Lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify strict comparison fixtures
        run: make lint-delta-test architecture-delta-test
      - name: Build the versioned analysis tools
        run: make ci-lint-tools CI_TOOL_DIR="${{ runner.temp }}/lint-tools"
      - name: Compare base and head in both lint orders
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          LINT_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
        run: |
          python3 scripts/lint-delta/run.py --repo "$GITHUB_WORKSPACE" \
            --base "$LINT_BASE" --head "$(git rev-parse HEAD)" --event "$LINT_EVENT" \
            --tools "${{ runner.temp }}/lint-tools" --output "${{ runner.temp }}/lint-delta"
      - name: Compare exact API shapes and architecture budgets
        run: |
          python3 scripts/architecture-delta/run.py \
            --lint-result "${{ runner.temp }}/lint-delta/result.json" \
            --tools "${{ runner.temp }}/lint-tools" --output "${{ runner.temp }}/architecture-delta"
      - name: Verify CGO-disabled compile discovery and failure fixtures
        if: matrix.os == 'ubuntu-latest'
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/platform-compile -p 'test_*.py' -v
      - name: Compile the original Linux CGO-disabled profiles
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/platform-compile/run.py --repo "$GITHUB_WORKSPACE" \
            --output "${{ runner.temp }}/platform-compile"
      - name: Verify on-demand checkpoint failure fixtures
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-latest'
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/checkpoint-capture -p 'test_*.py' -v
      - name: Capture the human architecture checkpoint and quiet coverage
        if: github.event_name == 'workflow_dispatch' && matrix.os == 'macos-latest'
        timeout-minutes: 20
        run: |
          python3 scripts/checkpoint-capture/run.py --repo "$GITHUB_WORKSPACE" \
            --tools "${{ runner.temp }}/lint-tools" --output "${{ runner.temp }}/checkpoint-capture"
      - name: Retain strict and architecture comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-delta-${{ matrix.os }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lint-delta/*.json
            ${{ runner.temp }}/architecture-delta/*.json
            ${{ runner.temp }}/lint-delta/base/modules.log
            ${{ runner.temp }}/lint-delta/head/modules.log
            ${{ runner.temp }}/lint-delta/base/*/strict.json
            ${{ runner.temp }}/lint-delta/head/*/strict.json
            ${{ runner.temp }}/lint-delta/base/*/scoped.json
            ${{ runner.temp }}/lint-delta/head/*/scoped.json
            ${{ runner.temp }}/lint-delta/base/*/make.log
            ${{ runner.temp }}/lint-delta/head/*/make.log
            ${{ runner.temp }}/platform-compile/**/*.json
            ${{ runner.temp }}/platform-compile/**/*.stdout
            ${{ runner.temp }}/platform-compile/**/*.stderr
            ${{ runner.temp }}/checkpoint-capture/*.json
            ${{ runner.temp }}/checkpoint-capture/*.stdout
            ${{ runner.temp }}/checkpoint-capture/*.stderr
            ${{ runner.temp }}/checkpoint-capture/*.md
            ${{ runner.temp }}/checkpoint-capture/*.out
            ${{ runner.temp }}/checkpoint-capture/cli/*.json
            ${{ runner.temp }}/checkpoint-capture/cli/*.log
            ${{ runner.temp }}/checkpoint-capture/cli/*.stdout
            ${{ runner.temp }}/checkpoint-capture/cli/*.stderr

  unraced-linux:
    name: Full owning tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify mutation stream and phase fixtures
        run: make fault-controls-test
      - name: Build and verify current-source assertion attribution
        run: |
          make ci-fault-tools CI_TOOL_DIR="${{ runner.temp }}/fault-tools"
          go test -count=1 ./scripts/assertion-sites
      - name: Run full unraced affected packages with a fresh unraced CLI
        env:
          FAULT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FAULT_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
        run: |
          python3 scripts/fault-controls/unraced.py --repo "$GITHUB_WORKSPACE" \
            --base "$FAULT_BASE" --head "$(git rev-parse HEAD)" --event "$FAULT_EVENT" \
            --tools "${{ runner.temp }}/fault-tools" --output "${{ runner.temp }}/unraced-affected"
      - name: Retain full Linux owning test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unraced-affected-ubuntu-latest
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/unraced-affected/*.json
            ${{ runner.temp }}/unraced-affected/*.log
            ${{ runner.temp }}/unraced-affected/cli/*.json
            ${{ runner.temp }}/unraced-affected/cli/*.log

  unraced-darwin:
    name: Full owning tests (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify mutation stream and phase fixtures
        run: make fault-controls-test
      - name: Build and verify current-source assertion attribution
        run: |
          make ci-fault-tools CI_TOOL_DIR="${{ runner.temp }}/fault-tools"
          go test -count=1 ./scripts/assertion-sites
      - name: Run full unraced affected packages with a fresh unraced CLI
        env:
          FAULT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FAULT_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
        run: |
          python3 scripts/fault-controls/unraced.py --repo "$GITHUB_WORKSPACE" \
            --base "$FAULT_BASE" --head "$(git rev-parse HEAD)" --event "$FAULT_EVENT" \
            --tools "${{ runner.temp }}/fault-tools" --output "${{ runner.temp }}/unraced-affected"
      - name: Retain full Darwin owning test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unraced-affected-macos-latest
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/unraced-affected/*.json
            ${{ runner.temp }}/unraced-affected/*.log
            ${{ runner.temp }}/unraced-affected/cli/*.json
            ${{ runner.temp }}/unraced-affected/cli/*.log

  fault-controls-linux:
    name: Focused mutation controls (ubuntu-latest)
    needs: [unraced-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Require completed Linux owning tests
        env:
          OWNING_RESULT: ${{ needs['unraced-linux'].result }}
        run: |
          if [[ "$OWNING_RESULT" != success ]]; then
            echo "Required Linux owning coverage incomplete: owning=$OWNING_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify mutation stream and phase fixtures
        run: make fault-controls-test
      - name: Build and verify current-source assertion attribution
        run: |
          make ci-fault-tools CI_TOOL_DIR="${{ runner.temp }}/fault-tools"
          go test -count=1 ./scripts/assertion-sites
      - name: Execute affected compiled positive, intended and restored controls
        env:
          FAULT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FAULT_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
        run: |
          python3 scripts/fault-controls/run.py --repo "$GITHUB_WORKSPACE" \
            --base "$FAULT_BASE" --head "$(git rev-parse HEAD)" --event "$FAULT_EVENT" \
            --tools "${{ runner.temp }}/fault-tools" --output "${{ runner.temp }}/fault-controls"
      - name: Retain Linux focused control receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fault-controls-ubuntu-latest
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fault-controls/*.json
            ${{ runner.temp }}/fault-controls/modules.log
            ${{ runner.temp }}/fault-controls/*/*.json
            ${{ runner.temp }}/fault-controls/*/*/*.log
            ${{ runner.temp }}/fault-controls/*/baseline-cli/buildinfo.json
            ${{ runner.temp }}/fault-controls/*/mutant-cli/buildinfo.json

  fault-controls-darwin:
    name: Focused mutation controls (macos-latest)
    needs: [unraced-darwin]
    if: always()
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Require completed Darwin owning tests
        env:
          OWNING_RESULT: ${{ needs['unraced-darwin'].result }}
        run: |
          if [[ "$OWNING_RESULT" != success ]]; then
            echo "Required Darwin owning coverage incomplete: owning=$OWNING_RESULT" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Verify mutation stream and phase fixtures
        run: make fault-controls-test
      - name: Build and verify current-source assertion attribution
        run: |
          make ci-fault-tools CI_TOOL_DIR="${{ runner.temp }}/fault-tools"
          go test -count=1 ./scripts/assertion-sites
      - name: Execute affected compiled positive, intended and restored controls
        env:
          FAULT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FAULT_EVENT: ${{ github.ref_type == 'tag' && 'tag' || github.event_name }}
        run: |
          python3 scripts/fault-controls/run.py --repo "$GITHUB_WORKSPACE" \
            --base "$FAULT_BASE" --head "$(git rev-parse HEAD)" --event "$FAULT_EVENT" \
            --tools "${{ runner.temp }}/fault-tools" --output "${{ runner.temp }}/fault-controls"
      - name: Retain Darwin focused control receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fault-controls-macos-latest
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/fault-controls/*.json
            ${{ runner.temp }}/fault-controls/modules.log
            ${{ runner.temp }}/fault-controls/*/*.json
            ${{ runner.temp }}/fault-controls/*/*/*.log
            ${{ runner.temp }}/fault-controls/*/baseline-cli/buildinfo.json
            ${{ runner.temp }}/fault-controls/*/mutant-cli/buildinfo.json

  windows-vet:
    # Report only: the count of packages that fail GOOS=windows go vet.
    name: Windows vet (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go mod download
      - name: Verify reporter discovery failures
        run: make windows-vet-test
      - name: Count failing packages
        run: bash scripts/windows-vet.sh "${{ runner.temp }}/windows-vet"
      - name: Retain Windows vet reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-vet
          path: ${{ runner.temp }}/windows-vet
          if-no-files-found: error

  vulnerabilities:
    name: Vulnerabilities
    uses: ./.github/workflows/security.yml

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: actionlint

  packaging:
    name: Packaging
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.18.3
          install-only: true
      - run: make completions release-check
      - run: goreleaser release --snapshot --clean --skip=publish
      - run: make package-check
