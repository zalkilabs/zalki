version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - bodyclose
    - gosec
    - revive
    - nolintlint
    - depguard
    # No findings in the code today; noctx is checked in the Makefile (see lint).
    - errname
    - copyloopvar
    - predeclared
    - usestdlibvars
  settings:
    depguard:
      rules:
        config:
          files: ["**/internal/config/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/model$
        core:
          files: ["**/internal/bus/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/agent$
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/journal$
            - github.com/zalkilabs/zalki/internal/logging$
            - github.com/zalkilabs/zalki/internal/model$
            - github.com/zalkilabs/zalki/internal/procwatch$
        process-mechanisms:
          files: ["**/internal/procwatch/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sys/unix$
        installer:
          files: ["**/internal/install/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/pelletier/go-toml/v2$
        agent:
          files: ["**/internal/agent/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/model$
        model:
          files: ["**/internal/model/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
        journal:
          files: ["**/internal/journal/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - golang.org/x/sys/unix$
        plugins:
          files: ["**/internal/plugins/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/bus$
            - github.com/zalkilabs/zalki/internal/model$
            - github.com/zalkilabs/zalki/internal/pluginfeed$
            - github.com/zalkilabs/zalki/internal/procwatch$
            - golang.org/x/sys/unix$
        pluginfeed:
          files: ["**/internal/pluginfeed/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/bus$
            - github.com/zalkilabs/zalki/internal/journal$
            - github.com/zalkilabs/zalki/internal/model$
        mcpserver:
          files: ["**/internal/mcpserver/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/modelcontextprotocol/go-sdk/mcp$
            - github.com/zalkilabs/zalki/internal/bus$
            - github.com/zalkilabs/zalki/internal/model$
        logging:
          files: ["**/internal/logging/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
        fsutil:
          files: ["**/internal/fsutil/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
        # Only procwatch may use raw OS calls. The files listed below are the
        # current users; remove a line when its file moves behind a platform API.
        # This list may only shrink; a file move or rename must update its line.
        os-calls:
          files:
            - "$all"
            - "!$test"
            - "!**/scripts/**"
            - "!**/internal/procwatch/*.go"
            - "!**/cmd/zalki/main.go"
            - "!**/cmd/zalki/plugin_install_term.go"
            - "!**/cmd/zalki/plugin_install_term_darwin.go"
            - "!**/cmd/zalki/plugin_install_term_linux.go"
            - "!**/cmd/zalki/plugin_supervise.go"
            - "!**/cmd/zalki/plugin_supervise_binary.go"
            - "!**/cmd/zalki/plugin_supervise_device_darwin.go"
            - "!**/cmd/zalki/plugin_supervise_device_linux.go"
            - "!**/cmd/zalki/plugin_supervise_logs.go"
            - "!**/cmd/zalki/plugin_supervise_process.go"
            - "!**/cmd/zalki/plugin_supervise_restart.go"
            - "!**/cmd/zalki/plugin_supervise_state.go"
            - "!**/cmd/zalki/plugin_supervised_host.go"
            - "!**/internal/adapters/codex/codex_app_server.go"
            - "!**/internal/bus/exit_observer.go"
            - "!**/internal/bus/hook_registration_quota.go"
            - "!**/internal/bus/listener.go"
            - "!**/internal/bus/liveness.go"
            - "!**/internal/bus/process.go"
            - "!**/internal/bus/process_stat_darwin.go"
            - "!**/internal/bus/process_stat_linux.go"
            - "!**/internal/bus/runtime.go"
            - "!**/internal/bus/socket.go"
            - "!**/internal/config/file.go"
            - "!**/internal/fsutil/fsutil.go"
            - "!**/internal/install/installation_lock.go"
            - "!**/internal/install/installation_plan.go"
            - "!**/internal/journal/lock.go"
            - "!**/internal/journal/order_darwin.go"
            - "!**/internal/journal/read_bytes.go"
            - "!**/internal/logging/errors.go"
            - "!**/internal/logging/file.go"
            - "!**/internal/pluginfeed/plugin_artifacts.go"
            - "!**/internal/pluginfeed/plugin_install.go"
            - "!**/internal/pluginfeed/plugin_installation.go"
            - "!**/internal/pluginfeed/plugin_launch.go"
            - "!**/internal/pluginfeed/plugin_lease.go"
            - "!**/internal/pluginfeed/plugin_update.go"
            - "!**/internal/pluginfeed/plugin_update_pins.go"
            - "!**/internal/plugins/child.go"
            - "!**/internal/plugins/install.go"
            - "!**/internal/plugins/install_process.go"
            - "!**/internal/plugins/install_process_darwin.go"
            - "!**/internal/plugins/install_process_linux.go"
            - "!**/internal/plugins/pin_identity.go"
            - "!**/internal/plugins/pin_identity_darwin.go"
            - "!**/internal/plugins/pin_identity_linux.go"
            - "!**/internal/plugins/supervised.go"
          list-mode: lax
          deny:
            - pkg: syscall
              desc: Only procwatch may use raw OS calls; use a platform API instead.
            - pkg: golang.org/x/sys
              desc: Only procwatch may use raw OS calls; use a platform API instead.
        pluginfeed-importers:
          files: ["$all", "!$test", "!**/cmd/zalki/*.go", "!**/internal/plugins/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/pluginfeed
              desc: Only cmd/zalki and plugins may compose plugin state; bus must use its injected port.
        plugin-importers:
          files: ["$all", "!**/cmd/zalki/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/plugins
              desc: Only cmd/zalki may compose plugin hosts.
        composition:
          files: ["**/internal/adapters/*.go", "!$test"]
          list-mode: strict
          allow:
            - github.com/zalkilabs/zalki/internal/agent$
            - github.com/zalkilabs/zalki/internal/adapters/codex$
            - github.com/zalkilabs/zalki/internal/adapters/claude$
            - github.com/zalkilabs/zalki/internal/adapters/cursor$
        client-isolation:
          files:
            - "**/internal/adapters/codex/**"
            - "**/internal/adapters/claude/**"
            - "**/internal/adapters/cursor/**"
          list-mode: lax
          allow:
            - github.com/zalkilabs/zalki/internal/adapters/internal/socketio$
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/adapters
              desc: Clients must not import the composition root or each other; only socketio is shared.
        socket-io:
          files: ["**/internal/adapters/internal/socketio/**"]
          list-mode: strict
          allow:
            - $gostd
    staticcheck:
      # ST1005 flags product names ("Cursor", "Claude") that start error strings.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    gosec:
      excludes:
        # Duplicates errcheck.
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
    # Checkpoint-only golangci-lint settings. The separate production
    # gocognit command in make lint uses its own threshold.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    revive:
      rules:
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    paths:
      - sandbox
    rules:
      # Tests may ignore close/cleanup errors and use fixed file modes.
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt

issues:
  # Report every finding; the default caps hide repeats of the same message.
  max-issues-per-linter: 0
  max-same-issues: 0
