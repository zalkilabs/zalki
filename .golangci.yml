version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - errorlint
    - bodyclose
    - gosec
    - revive
    - nolintlint
    - depguard
    # No findings in the code today; noctx is checked in the Makefile (see lint).
    - errname
    - copyloopvar
    - predeclared
    - usestdlibvars
  settings:
    depguard:
      rules:
        config:
          files: ["**/internal/config/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/model$
        core:
          files: ["**/internal/bus/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/agent$
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/journal$
            - github.com/zalkilabs/zalki/internal/logging$
            - github.com/zalkilabs/zalki/internal/model$
            - github.com/zalkilabs/zalki/internal/procwatch$
            - golang.org/x/sys/unix$
        process-mechanisms:
          files: ["**/internal/procwatch/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - golang.org/x/sys/unix$
        installer:
          files: ["**/internal/install/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/pelletier/go-toml/v2$
        agent:
          files: ["**/internal/agent/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/model$
        model:
          files: ["**/internal/model/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
        journal:
          files: ["**/internal/journal/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/fsutil$
            - golang.org/x/sys/unix$
        plugins:
          files: ["**/internal/plugins/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/bus$
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/journal$
            - github.com/zalkilabs/zalki/internal/model$
            - github.com/zalkilabs/zalki/internal/pluginfeed$
            - github.com/zalkilabs/zalki/internal/procwatch$
            - golang.org/x/sys/unix$
        pluginfeed:
          files: ["**/internal/pluginfeed/*.go", "!$test"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/zalkilabs/zalki/internal/bus$
            - github.com/zalkilabs/zalki/internal/fsutil$
            - github.com/zalkilabs/zalki/internal/journal$
            - github.com/zalkilabs/zalki/internal/model$
        pluginfeed-importers:
          files: ["$all", "!$test", "!**/cmd/zalki/*.go", "!**/internal/plugins/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/pluginfeed
              desc: Only cmd/zalki and plugins may compose plugin state; bus must use its injected port.
        plugin-importers:
          files: ["$all", "!**/cmd/zalki/*.go"]
          list-mode: lax
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/plugins
              desc: Only cmd/zalki may compose plugin hosts.
        composition:
          files: ["**/internal/adapters/*.go", "!$test"]
          list-mode: strict
          allow:
            - github.com/zalkilabs/zalki/internal/agent$
            - github.com/zalkilabs/zalki/internal/adapters/codex$
            - github.com/zalkilabs/zalki/internal/adapters/claude$
            - github.com/zalkilabs/zalki/internal/adapters/cursor$
        client-isolation:
          files:
            - "**/internal/adapters/codex/**"
            - "**/internal/adapters/claude/**"
            - "**/internal/adapters/cursor/**"
          list-mode: lax
          allow:
            - github.com/zalkilabs/zalki/internal/adapters/internal/socketio$
          deny:
            - pkg: github.com/zalkilabs/zalki/internal/adapters
              desc: Clients must not import the composition root or each other; only socketio is shared.
        socket-io:
          files: ["**/internal/adapters/internal/socketio/**"]
          list-mode: strict
          allow:
            - $gostd
    staticcheck:
      # ST1005 flags product names ("Cursor", "Claude") that start error strings.
      checks: ["all", "-ST1000", "-ST1003", "-ST1005", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]
    gosec:
      excludes:
        # Duplicates errcheck.
        - G104
    nolintlint:
      require-explanation: true
      require-specific: true
    # Checkpoint-only golangci-lint settings. The separate production
    # gocognit command in make lint uses its own threshold.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    funlen:
      lines: 80
      statements: 50
    revive:
      rules:
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: indent-error-flow
        - name: errorf
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    paths:
      - sandbox
    rules:
      # Tests may ignore close/cleanup errors and use fixed file modes.
      - path: _test\.go
        linters: [errcheck, gosec]

formatters:
  enable:
    - gofmt

issues:
  # Report every finding; the default caps hide repeats of the same message.
  max-issues-per-linter: 0
  max-same-issues: 0
